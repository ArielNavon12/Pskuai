<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Golden Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGrad)" opacity="0.12" filter="url(#shadow)"/>

  <!-- Torah Scroll Symbol -->
  <g transform="translate(76, 96)">
    <!-- Wooden Scroll Rollers Left and Right -->
    <rect x="28" y="20" width="24" height="280" rx="12" fill="url(#goldGrad)"/>
    <circle cx="40" cy="16" r="20" fill="url(#goldGrad)"/>
    <circle cx="40" cy="304" r="20" fill="url(#goldGrad)"/>

    <rect x="308" y="20" width="24" height="280" rx="12" fill="url(#goldGrad)"/>
    <circle cx="320" cy="16" r="20" fill="url(#goldGrad)"/>
    <circle cx="320" cy="304" r="20" fill="url(#goldGrad)"/>

    <!-- Parchment Canvas -->
    <path d="M 44 48 Q 180 32 316 48 L 316 272 Q 180 256 44 272 Z" fill="url(#scrollGrad)" filter="url(#shadow)"/>

    <!-- Decorative Text Lines on Parchment -->
    <g fill="#78350f" opacity="0.75">
      <rect x="80" y="80" width="90" height="8" rx="4"/>
      <rect x="80" y="104" width="85" height="8" rx="4"/>
      <rect x="80" y="128" width="90" height="8" rx="4"/>
      <rect x="80" y="152" width="70" height="8" rx="4"/>

      <rect x="190" y="80" width="90" height="8" rx="4"/>
      <rect x="190" y="104" width="85" height="8" rx="4"/>
      <rect x="190" y="128" width="90" height="8" rx="4"/>
      <rect x="190" y="152" width="65" height="8" rx="4"/>
    </g>

    <!-- Hebrew Letter "פ" in center of scroll -->
    <text x="180" y="228" font-family="serif" font-size="64" font-weight="900" fill="#b45309" text-anchor="middle">פ</text>
  </g>
</svg>
